---
# See README.md for why this is a plain fstab mount rather than a watchdog
# daemon like Nomadintosh's.
- name: Manage NFS mounts
  when: nfs_mounts_shares | length > 0
  become: true
  block:
    - name: Require nas_host when NFS shares are configured
      ansible.builtin.assert:
        that:
          - nas_host is defined
          - nas_host | string | length > 0
        fail_msg: >-
          nfs_mounts_shares is set for {{ inventory_hostname }} but nas_host
          isn't - set it to your NAS's address in your own inventory
          (group_vars/host_vars) or as an extra var. This collection
          deliberately ships no default for it.
        quiet: true

    - name: Install NFS client packages
      ansible.builtin.apt:
        name: nfs-common
        state: present

    - name: Ensure NFS mount points exist
      ansible.builtin.file:
        path: "{{ volume_mount_path }}/{{ item.share_export_path | basename | lower }}"
        state: directory
        mode: '0755'
      loop: "{{ nfs_mounts_shares }}"
      loop_control:
        label: "{{ volume_mount_path }}/{{ item.share_export_path | basename | lower }}"

    - name: Mount NFS shares
      ansible.posix.mount:
        src: "{{ nas_host }}:{{ item.share_export_path }}"
        path: "{{ volume_mount_path }}/{{ item.share_export_path | basename | lower }}"
        fstype: nfs
        opts: "nfsvers={{ nfs_mounts_version }},rsize={{ nfs_mounts_rsize }},wsize={{ nfs_mounts_wsize }},\
timeo={{ nfs_mounts_timeo }},retrans={{ nfs_mounts_retrans }},_netdev"
        state: mounted
      loop: "{{ nfs_mounts_shares }}"
      loop_control:
        label: "{{ volume_mount_path }}/{{ item.share_export_path | basename | lower }}"
