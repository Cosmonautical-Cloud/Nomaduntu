---
# The nomad package's own unit ships `User=root`/`Group=root` - its own
# comment says this is because Nomad *clients* need root (cgroups/chroot for
# the exec driver, bridge networking, binding <1024). This cluster only ever
# uses raw_exec and docker, neither of which needs that, so a drop-in
# overrides it to match Consul's already-non-root pattern (and Nomadintosh's
# non-root macOS agents). Revisit if the exec driver or bridge networking is
# ever needed here.
- name: Ensure Nomad systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/nomad.service.d
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Override Nomad systemd unit to run as the nomad user
  ansible.builtin.copy:
    dest: /etc/systemd/system/nomad.service.d/override.conf
    content: |
      [Service]
      User=nomad
      Group=nomad
    mode: '0644'
    owner: root
    group: root
  register: nomad_override_result

- name: Reload systemd daemon
  ansible.builtin.systemd_service:
    daemon_reload: true

# Restarts roll one host at a time, waiting for each agent and the server
# cluster to report healthy before moving on, so a run that changes every
# server never takes more than one of them out of quorum.
- name: Ensure Nomad is running
  ansible.builtin.systemd_service:
    name: nomad
    enabled: true
    state: started
  register: nomad_started_result

# A service that was only just started above already picked up everything.
- name: Record whether Nomad needs a restart on this host
  ansible.builtin.set_fact:
    nomad_restart_needed: >-
      {{ not nomad_started_result.changed and (
           nomad_config_result.changed or
           nomad_package_install.changed | default(false) or
           nomad_directories_result.changed or
           nomad_override_result.changed or
           nomad_docker_group_result.changed | default(false)) }}

- name: Roll Nomad restarts across hosts
  any_errors_fatal: true
  block:
    - name: Restart Nomad one host at a time
      ansible.builtin.include_tasks: rolling_restart.yml
      loop: >-
        {{ ansible_play_hosts | map('extract', hostvars)
           | selectattr('nomad_restart_needed', 'defined') | selectattr('nomad_restart_needed')
           | map(attribute='inventory_hostname') | list }}
      loop_control:
        loop_var: nomad_restart_host
      when: inventory_hostname == ansible_play_hosts[0]
