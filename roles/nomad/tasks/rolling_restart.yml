---
# Runs once per host needing a restart, from the first play host, delegating
# to nomad_restart_host - see service.yml.
- name: Restart Nomad on {{ nomad_restart_host }}
  delegate_to: "{{ nomad_restart_host }}"
  ansible.builtin.systemd_service:
    name: nomad
    state: restarted

- name: Wait for Nomad agent health on {{ nomad_restart_host }}
  delegate_to: "{{ nomad_restart_host }}"
  ansible.builtin.uri:
    url: "http://{{ hostvars[nomad_restart_host]['ansible_facts']['default_ipv4']['address'] }}:4646/v1/agent/health"
  register: nomad_restart_check
  until: nomad_restart_check.status == 200
  retries: "{{ nomad_restart_retries }}"
  delay: "{{ nomad_restart_delay }}"
  check_mode: false

- name: Wait for the Nomad server cluster to report healthy
  delegate_to: "{{ nomad_restart_host }}"
  ansible.builtin.uri:
    url: "http://{{ hostvars[nomad_restart_host]['ansible_facts']['default_ipv4']['address'] }}:4646/v1/operator/autopilot/health"
  register: nomad_restart_autopilot
  until: nomad_restart_autopilot.status == 200 and nomad_restart_autopilot.json.Healthy | default(false)
  retries: "{{ nomad_restart_retries }}"
  delay: "{{ nomad_restart_delay }}"
  check_mode: false
