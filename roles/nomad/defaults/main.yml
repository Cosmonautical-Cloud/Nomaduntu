---
nomad_config_dir: "{{ config_dir }}/nomad.d"

nomad_working_dir: "{{ working_dir }}/nomad"

nomad_jobs_dir: "{{ nomad_working_dir }}/jobs"

# Health polling after each rolling restart (see tasks/service.yml): up to
# retries x delay seconds before the run fails and stops restarting others.
nomad_restart_retries: 36
nomad_restart_delay: 5
