---
- name: Perform Nomaduntu deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Gate Nomaduntu deployment to Debian-based systems
      when: ansible_facts['os_family'] == 'Debian'
      block:
        - name: Set datacenter fact
          ansible.builtin.include_role:
            name: facts
          tags:
            - facts

        - name: Include APT Repository
          ansible.builtin.include_role:
            name: apt_repo
          tags:
            - apt_repo

        - name: Include APT Update
          ansible.builtin.include_role:
            name: apt_update
          tags:
            - apt_update

        - name: Include Docker role
          ansible.builtin.include_role:
            name: docker
          when: docker.enabled | default(false)
          tags:
            - docker
            - container-runtime

        - name: Mount NFS shares
          ansible.builtin.include_role:
            name: nfs_mounts
          tags:
            - nfs_mounts

        - name: Include Consul role
          ansible.builtin.include_role:
            name: consul
          tags:
            - consul

        - name: Include Nomad role
          ansible.builtin.include_role:
            name: nomad
          tags:
            - nomad
