---
- name: Discover host OS family
  hosts: all
  gather_facts: true
  tasks:
    - name: Group hosts by OS family
      ansible.builtin.group_by:
        key: "os_{{ ansible_facts['os_family'] }}"

- name: Clean up stale apt residue
  hosts: os_Debian
  gather_facts: false
  tasks:
    - name: Run apt autoremove
      ansible.builtin.include_role:
        name: clean
