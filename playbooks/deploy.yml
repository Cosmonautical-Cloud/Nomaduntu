---
- name: Discover host OS family
  hosts: all
  gather_facts: true
  tasks:
    - name: Group hosts by OS family
      ansible.builtin.group_by:
        key: "os_{{ ansible_facts['os_family'] }}"
      # Without this, any --tags run skips discovery and the deployment play
      # below matches no hosts.
      tags:
        - always

- name: Perform Nomaduntu deployment
  hosts: os_Debian
  # Facts already gathered in the discovery play above.
  gather_facts: false
  tasks:
    # Resolves the Nomad and Consul datacenters from DNS (and fails early on
    # hosts that aren't listed by FQDN). Tagged always because the consul
    # and nomad roles' templates read these facts.
    - name: Resolve datacenters
      ansible.builtin.include_role:
        name: facts
        apply:
          tags:
            - always
      tags:
        - always

    - name: Include APT Repository
      ansible.builtin.include_role:
        name: apt_repo
        apply:
          tags:
            - apt_repo
      tags:
        - apt_repo

    - name: Include APT Update
      ansible.builtin.include_role:
        name: apt_update
        apply:
          tags:
            - apt_update
      tags:
        - apt_update

    - name: Include Docker role
      ansible.builtin.include_role:
        name: docker
        apply:
          tags:
            - docker
            - container-runtime
      # docker.enabled: false (not just absent) actively tears down an
      # existing install - see roles/docker/README.md.
      when: docker.enabled is defined
      tags:
        - docker
        - container-runtime

    - name: Mount NFS shares
      ansible.builtin.include_role:
        name: nfs_mounts
        apply:
          tags:
            - nfs_mounts
      tags:
        - nfs_mounts

    - name: Include Consul role
      ansible.builtin.include_role:
        name: consul
        apply:
          tags:
            - consul
      tags:
        - consul

    - name: Include Nomad role
      ansible.builtin.include_role:
        name: nomad
        apply:
          tags:
            - nomad
      tags:
        - nomad
