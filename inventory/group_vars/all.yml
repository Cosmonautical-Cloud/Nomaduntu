---
config_dir: /etc

working_dir: /opt

nomad_config_dir: "{{ config_dir }}/nomad.d"

nomad_working_dir: "{{ working_dir }}/nomad"

consul_config_dir: "{{ config_dir }}/consul.d"

consul_working_dir: "{{ working_dir }}/consul"

nomad_jobs_dir: "{{ nomad_working_dir }}/jobs"

# The real Consul/Nomad control plane (cassiopeia/taurus/betelgeuse) lives in
# a separate Ansible project (Nomadintosh) that this inventory doesn't
# include - it's documented there, not managed here. Every host in *this*
# inventory is a client-only node that joins that existing cluster, same
# pattern as Nomadintosh's own jellify hosts (galileo/hopper). Consul only
# has the one datacenter cluster-wide - Nomad's "datacenter" is purely a
# job-placement tag, and is distinct from Consul's. See
# roles/consul/templates/consul.hcl.j2 and roles/nomad/templates/nomad.hcl.j2.
existing_cluster_servers:
  - cassiopeia.cosmonautical.cloud
  - taurus.cosmonautical.cloud
  - betelgeuse.cosmonautical.cloud
existing_consul_datacenter: cosmonautical

# Same NAS as the cosmonautical/jellify macOS hosts, see
# roles/nfs_mounts/defaults/main.yml.
nas_host: 10.10.37.32
